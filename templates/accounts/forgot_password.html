{% extends "base.html" %}
{% block title %}Reset Password - Smart ATS{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="card-title fw-bold mb-2">Forgot Password</h4>
                <p class="text-muted small mb-4">Enter your registered email address to receive password reset instructions.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        {{ form.email }}
                        {{ form.email.errors }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Reset Instructions</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'accounts:login' %}" class="small text-muted">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
